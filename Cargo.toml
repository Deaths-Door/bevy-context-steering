[package]
name = "bevy_context_steering"
version = "0.1.0"
edition = "2024"
license = "Apache 2.0"
description = "A 3D (and 2D) agent context steering framework for Bevy + Avian3D."
documentation = "https://docs.rs/bevy_context_steering/latest/bevy_context_steering/"
repository = "https://github.com/Deaths-Door/bevy-context-steering"

[workspace.dependencies]
avian3d = { version = "0.7.0", default-features = false, features = [
    "3d",
    "parallel",
    "default-collider",
    "f32",
    "parry-f32",
] }
bevy = { version = "0.19.0", default-features = false }

[features]
default = ["debug"]
debug = ["bevy/bevy_color", "bevy/bevy_gizmos"]

[dependencies]
bevy.workspace = true
avian3d.workspace = true

bevy_many_relationships = { git = "https://github.com/JViggiani/bevy_many_relationships", rev = "b077b5152e83f8a61c397e321a2df00142b68105" }


[dev-dependencies]
test-case = "3.3.1"
bevy = { workspace = true , features = ["bevy_scene"]}
